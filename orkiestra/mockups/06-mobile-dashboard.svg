<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>orkiestrA: Dashboard (mobile, light)</title>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;font-size:16px}
      .xs{font-size:12px}.sm{font-size:14px}.lg{font-size:20px}.xl{font-size:24px}.h{font-size:32px;font-weight:700}
      .m{font-weight:500}.b{font-weight:700}
      .mu{fill:#64748b}.pr{fill:#4f46e5}.pr7{fill:#4338ca}.ok{fill:#15803d}.wa{fill:#b45309}.in{fill:#0369a1}.w{fill:#fff}
      .e{text-anchor:end}.c{text-anchor:middle}
      .card{fill:#fff;stroke:#e2e8f0;filter:url(#sh)}
      .ic{fill:none;stroke:#64748b;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
      .ic.a{stroke:#4338ca}.ic.d{stroke:#0f172a}
    </style>
  </defs>

  <rect width="390" height="844" fill="#ffffff"/>

  <!-- Status bar -->
  <text x="32" y="30" class="sm b">9:41</text>
  <rect x="330" y="19" width="24" height="12" rx="3" fill="none" stroke="#0f172a"/>
  <rect x="332" y="21" width="17" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="355" y="23" width="2" height="4" rx="1" fill="#0f172a"/>

  <!-- App bar -->
  <g transform="translate(28 62)" class="ic d"><path d="M2 5h16M2 10h16M2 15h16"/></g>
  <text x="68" y="79" class="lg b">Dashboard</text>
  <g transform="translate(296 62)" class="ic d"><path d="M5 14V9a5 5 0 0110 0v5l1.5 2h-13z"/><path d="M8.5 18h3"/></g>
  <circle cx="313" cy="63" r="4" fill="#b91c1c" stroke="#fff" stroke-width="2"/>
  <circle cx="354" cy="72" r="18" fill="#e0e7ff"/>
  <text x="354" y="77" class="sm b c" style="fill:#312e81">DW</text>
  <path d="M0 100.5H390" stroke="#e2e8f0"/>

  <text x="16" y="132" class="sm mu">Wed, Oct 28 · 1 run in progress</text>

  <!-- KPI grid -->
  <rect x="16.5" y="148.5" width="172" height="96" rx="8" class="card"/>
  <text x="32" y="178" class="sm mu">Active runs</text>
  <text x="32" y="222" class="h">1</text>
  <rect x="201.5" y="148.5" width="172" height="96" rx="8" class="card"/>
  <text x="217" y="178" class="sm mu">Tasks completed</text>
  <text x="217" y="222" class="h">128</text>
  <text x="358" y="222" class="xs m ok e">▲ 18%</text>
  <rect x="16.5" y="256.5" width="172" height="96" rx="8" class="card"/>
  <text x="32" y="286" class="sm mu">First-attempt pass</text>
  <text x="32" y="330" class="h">87%</text>
  <rect x="201.5" y="256.5" width="172" height="96" rx="8" class="card"/>
  <text x="217" y="286" class="sm mu">Median task time</text>
  <text x="217" y="330" class="h">14m</text>

  <!-- Needs attention -->
  <text x="16" y="392" class="lg m">Needs your attention</text>
  <rect x="16.5" y="408.5" width="357" height="76" rx="8" class="card"/>
  <circle cx="40" cy="446" r="12" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="40" y="451" class="sm b wa c">!</text>
  <text x="64" y="440" class="m">UX copy pass</text>
  <text x="64" y="460" class="xs mu">Round 2 · t6 · ready for review</text>
  <rect x="282.5" y="424.5" width="75" height="43" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="320" y="451" class="sm m c">Review</text>

  <!-- Recent runs -->
  <text x="16" y="524" class="lg m">Recent runs</text>
  <text x="374" y="524" class="sm m pr e">View all</text>

  <rect x="16.5" y="540.5" width="357" height="96" rx="8" class="card"/>
  <text x="32" y="568" class="m">Round 2 · Design phase</text>
  <rect x="271.5" y="552.5" width="87" height="23" rx="11.5" fill="#fff" stroke="#0369a1"/>
  <circle cx="285" cy="564" r="3" fill="#0369a1"/>
  <text x="295" y="568" class="xs m in">Running</text>
  <rect x="32" y="586" width="270" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="32" y="586" width="135" height="8" rx="4" fill="#4f46e5"/>
  <text x="358" y="595" class="sm mu e">4 / 8</text>
  <text x="32" y="620" class="xs mu">3 agents · started today at 06:29</text>

  <rect x="16.5" y="648.5" width="357" height="96" rx="8" class="card"/>
  <text x="32" y="676" class="m">Hotfix · Token contrast</text>
  <rect x="243.5" y="660.5" width="115" height="23" rx="11.5" fill="#fff" stroke="#b45309"/>
  <text x="257" y="676" class="xs b wa c">!</text>
  <text x="267" y="676" class="xs m wa">Needs review</text>
  <rect x="32" y="694" width="270" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="32" y="694" width="135" height="8" rx="4" fill="#4f46e5"/>
  <text x="358" y="703" class="sm mu e">1 / 2</text>
  <text x="32" y="728" class="xs mu">1 agent · started yesterday at 21:40</text>

  <!-- Tab bar -->
  <rect x="0" y="760" width="390" height="84" fill="#f8fafc"/>
  <path d="M0 760.5H390" stroke="#e2e8f0"/>
  <g transform="translate(39 772)" class="ic a"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></g>
  <text x="49" y="808" class="xs m pr7 c">Home</text>
  <g transform="translate(136 772)" class="ic"><circle cx="10" cy="10" r="8"/><path d="M8 6.5l5 3.5-5 3.5z"/></g>
  <text x="146" y="808" class="xs m mu c">Runs</text>
  <g transform="translate(234 772)" class="ic"><rect x="2" y="2" width="16" height="16" rx="3"/><path d="M6 10l3 3 5-6"/></g>
  <text x="244" y="808" class="xs m mu c">Tasks</text>
  <g transform="translate(331 772)" class="ic"><rect x="5" y="5" width="10" height="10" rx="2"/><path d="M8 2v3M12 2v3M8 15v3M12 15v3M2 8h3M2 12h3M15 8h3M15 12h3"/></g>
  <text x="341" y="808" class="xs m mu c">Agents</text>
  <rect x="128" y="830" width="134" height="5" rx="2.5" fill="#0f172a"/>
</svg>
