<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <title>orkiestrA: Sign in (desktop, light)</title>
  <defs>
    <filter id="shm" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;font-size:16px}
      .xs{font-size:12px}.sm{font-size:14px}.lg{font-size:20px}.xl{font-size:24px}
      .m{font-weight:500}.b{font-weight:700}
      .mu{fill:#64748b}.pr{fill:#4f46e5}.w{fill:#fff}
      .e{text-anchor:end}.c{text-anchor:middle}
      .ic{fill:none;stroke:#64748b;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1440" height="960" fill="#f8fafc"/>

  <!-- Brand -->
  <rect x="644" y="120" width="40" height="40" rx="8" fill="#4f46e5"/>
  <path d="M654 150V138M660.5 150V130M667 150V135M673.5 150V142" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="696" y="148" class="xl b">orkiestrA</text>

  <!-- Card -->
  <rect x="520" y="200" width="400" height="500" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shm)"/>
  <text x="552" y="252" class="xl b">Sign in</text>
  <text x="552" y="280" class="sm mu">Coordinate AI agents across your repositories.</text>

  <!-- GitHub -->
  <rect x="552.5" y="304.5" width="335" height="43" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="644" cy="326" r="9" fill="#0f172a"/>
  <path d="M640 331c0-2 1-3 2-3.5-2.5-.3-4-1.5-4-4 0-1 .4-1.8 1-2.4-.1-.5-.2-1.4.1-2.3 1 0 1.8.6 2.4 1a7 7 0 013 0c.6-.4 1.4-1 2.4-1 .3.9.2 1.8.1 2.3.6.6 1 1.4 1 2.4 0 2.5-1.5 3.7-4 4 1 .5 2 1.5 2 3.5" fill="none" stroke="#fff" stroke-width="1.2"/>
  <text x="664" y="331" class="sm m">Continue with GitHub</text>

  <!-- Divider -->
  <path d="M552 376.5H704M736 376.5H888" stroke="#e2e8f0"/>
  <text x="720" y="381" class="xs mu c">or</text>

  <!-- Email -->
  <text x="552" y="420" class="sm m">Email</text>
  <rect x="552.5" y="432.5" width="335" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="568" y="459" class="mu">you@company.com</text>

  <!-- Password (focused) -->
  <text x="552" y="504" class="sm m">Password</text>
  <text x="888" y="504" class="sm m pr e">Forgot password?</text>
  <rect x="550" y="514" width="340" height="48" rx="6" fill="none" stroke="#e0e7ff" stroke-width="4"/>
  <rect x="553" y="517" width="334" height="42" rx="4" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <g fill="#0f172a"><circle cx="572" cy="538" r="3.5"/><circle cx="584" cy="538" r="3.5"/><circle cx="596" cy="538" r="3.5"/><circle cx="608" cy="538" r="3.5"/><circle cx="620" cy="538" r="3.5"/><circle cx="632" cy="538" r="3.5"/><circle cx="644" cy="538" r="3.5"/><circle cx="656" cy="538" r="3.5"/><circle cx="668" cy="538" r="3.5"/><circle cx="680" cy="538" r="3.5"/></g>
  <rect x="686" y="528" width="1.5" height="20" fill="#0f172a"/>
  <g transform="translate(856 528)" class="ic"><path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="10" cy="10" r="2.5"/></g>

  <!-- Remember me -->
  <rect x="552" y="584" width="20" height="20" rx="4" fill="#4f46e5"/>
  <path d="M557 594l3 3 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="584" y="599" class="sm">Keep me signed in on this device</text>

  <!-- Submit -->
  <rect x="552" y="624" width="336" height="44" rx="8" fill="#4f46e5"/>
  <text x="720" y="651" class="sm m w c">Sign in</text>

  <text x="720" y="744" class="sm c"><tspan class="mu">New to orkiestrA?</tspan> <tspan class="pr m">Create an account</tspan></text>
  <text x="720" y="920" class="xs mu c">Terms · Privacy · Status</text>
</svg>
