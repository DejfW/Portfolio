<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <title>orkiestrA: New run dialog (desktop, light)</title>
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a;font-size:16px}
      .xs{font-size:12px}.sm{font-size:14px}.lg{font-size:20px}.xl{font-size:24px}.h{font-size:32px;font-weight:700}
      .m{font-weight:500}.b{font-weight:700}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .mu{fill:#64748b}.pr{fill:#4f46e5}.pr7{fill:#4338ca}.w{fill:#fff}
      .e{text-anchor:end}.c{text-anchor:middle}
      .card{fill:#fff;stroke:#e2e8f0;filter:url(#sh)}
      .ic{fill:none;stroke:#64748b;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
      .ic.a{stroke:#4338ca}.ic.w{stroke:#fff}.ic.d{stroke:#0f172a}
      .ph{fill:#f1f5f9}
    </style>
  </defs>

  <!-- ============ Background page (dashboard, simplified) ============ -->
  <rect width="1440" height="960" fill="#ffffff"/>
  <rect width="240" height="960" fill="#f8fafc"/>
  <path d="M240.5 0V960M240 64.5H1440" stroke="#e2e8f0"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#4f46e5"/>
  <path d="M32.5 40V30M37.5 40V24M42.5 40V28M47.5 40V33" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="68" y="39" class="lg b">orkiestrA</text>
  <rect x="12" y="72" width="216" height="44" rx="8" fill="#eef2ff"/>
  <text x="56" y="99" class="m pr7">Dashboard</text>
  <text x="56" y="147">Runs</text>
  <text x="56" y="195">Tasks</text>
  <text x="56" y="243">Agents</text>
  <text x="56" y="291">Repositories</text>
  <rect x="272.5" y="10.5" width="400" height="43" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1232" y="10" width="120" height="44" rx="8" fill="#4f46e5"/>
  <text x="1276" y="37" class="sm m w">New run</text>
  <circle cx="1386" cy="32" r="22" fill="#e0e7ff"/>
  <text x="272" y="124" class="h">Dashboard</text>
  <rect x="272.5" y="184.5" width="266" height="120" rx="8" class="card"/>
  <rect x="562.5" y="184.5" width="266" height="120" rx="8" class="card"/>
  <rect x="852.5" y="184.5" width="266" height="120" rx="8" class="card"/>
  <rect x="1142.5" y="184.5" width="265" height="120" rx="8" class="card"/>
  <rect x="272.5" y="328.5" width="740" height="300" rx="8" class="card"/>
  <rect x="1036.5" y="328.5" width="371" height="300" rx="8" class="card"/>
  <rect x="272.5" y="652.5" width="1135" height="272" rx="8" class="card"/>

  <!-- Scrim -->
  <rect width="1440" height="960" fill="#0f172a" fill-opacity="0.5"/>

  <!-- ============ Dialog ============ -->
  <rect x="440" y="84" width="560" height="792" rx="16" fill="#fff" filter="url(#shm)"/>
  <text x="472" y="136" class="xl b">New run</text>
  <text x="472" y="164" class="sm mu">Choose a repository and a task plan. Agents start right away.</text>
  <rect x="934" y="106" width="44" height="44" rx="8" fill="#fff"/>
  <path d="M949 121l14 14M963 121l-14 14" class="ic d"/>
  <path d="M440 188.5H1000" stroke="#e2e8f0"/>

  <!-- Run name -->
  <text x="472" y="228" class="sm m">Run name</text>
  <rect x="472.5" y="240.5" width="495" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="488" y="267">Round 3 · Build phase</text>

  <!-- Repo / branch -->
  <text x="472" y="316" class="sm m">Repository</text>
  <rect x="472.5" y="328.5" width="239" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <g transform="translate(486 340)" class="ic"><circle cx="6" cy="4" r="2"/><circle cx="6" cy="16" r="2"/><circle cx="14" cy="7" r="2"/><path d="M6 6v8M14 9c0 3-4 3-7 5"/></g>
  <text x="514" y="355">orkiestrA</text>
  <g transform="translate(682 340)" class="ic"><path d="M6 8l4 4 4-4"/></g>

  <text x="728" y="316" class="sm m">Base branch</text>
  <rect x="728.5" y="328.5" width="239" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="744" y="355" class="mono sm">main</text>
  <g transform="translate(938 340)" class="ic"><path d="M6 8l4 4 4-4"/></g>

  <!-- Task plan -->
  <text x="472" y="404" class="sm m">Task plan</text>
  <rect x="472.5" y="416.5" width="495" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <g transform="translate(488 434)" class="ic"><path d="M4 2h8l4 4v12H4z"/><path d="M12 2v4h4M7 11h6M7 14h4"/></g>
  <text x="520" y="440" class="sm mono">tasks/round-3.yaml</text>
  <text x="520" y="458" class="xs mu">6 tasks · 4 dependencies · validated</text>
  <text x="952" y="449" class="sm m pr e">Change</text>

  <!-- Default agent -->
  <text x="472" y="504" class="sm m">Default agent</text>
  <text x="968" y="504" class="xs mu e">Tasks can override this</text>

  <rect x="472.5" y="516.5" width="159" height="79" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="488" y="544" class="sm m">Opus 5.5</text>
  <text x="488" y="564" class="xs mu">High effort</text>
  <text x="488" y="582" class="xs mu">Hard, open-ended</text>
  <circle cx="608" cy="539" r="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="641" y="517" width="158" height="78" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="656" y="544" class="sm m pr7">Sonnet 5.5</text>
  <text x="656" y="564" class="xs mu">Medium effort</text>
  <text x="656" y="582" class="xs mu">Balanced default</text>
  <circle cx="776" cy="539" r="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="776" cy="539" r="4" fill="#4f46e5"/>

  <rect x="808.5" y="516.5" width="159" height="79" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="824" y="544" class="sm m">Haiku 5.5</text>
  <text x="824" y="564" class="xs mu">Low effort</text>
  <text x="824" y="582" class="xs mu">Quick edits</text>
  <circle cx="944" cy="539" r="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Steppers -->
  <text x="472" y="628" class="sm m">Tasks in parallel</text>
  <rect x="472.5" y="640.5" width="143" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <path d="M516.5 641V683M571.5 641V683" stroke="#cbd5e1"/>
  <path d="M488 662h12" class="ic d"/>
  <text x="544" y="667" class="m c">3</text>
  <path d="M588 662h12M594 656v12" class="ic d"/>

  <text x="728" y="628" class="sm m">Attempts per task</text>
  <rect x="728.5" y="640.5" width="143" height="43" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <path d="M772.5 641V683M827.5 641V683" stroke="#cbd5e1"/>
  <path d="M744 662h12" class="ic d"/>
  <text x="800" y="667" class="m c">3</text>
  <path d="M844 662h12M850 656v12" class="ic d"/>

  <!-- Review toggle -->
  <rect x="472" y="716" width="40" height="24" rx="12" fill="#4f46e5"/>
  <circle cx="500" cy="728" r="9" fill="#fff"/>
  <text x="528" y="733" class="sm m">Require my review before merging</text>
  <text x="528" y="756" class="xs mu">Each finished task waits for your approval before it merges into main.</text>

  <!-- Footer -->
  <path d="M440 784.5H1000" stroke="#e2e8f0"/>
  <rect x="752.5" y="808.5" width="103" height="43" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="804" y="835" class="sm m c">Cancel</text>
  <rect x="868" y="808" width="100" height="44" rx="8" fill="#4f46e5"/>
  <text x="918" y="835" class="sm m w c">Start run</text>
</svg>
