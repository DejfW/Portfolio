<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d">
  <title id="t">System architecture of the furniture workshop automation</title>
  <desc id="d">Input channels (form, calculator, showroom tablet, e-mail) reach n8n workflows, which call SQL functions in Supabase. The database is the single source of truth, and notifications go through outbox queues to Slack and Gmail. The AI model runs locally through agy.</desc>
  <style>
    :root { --bg:#1b1728; --box:#1a1624; --ink:#d1cece; --muted:#9d9797; --line:#3e3a46; --accent:#fd8925; --db:#1f2336; --ai:#2a1f22; }
    text { font: 13px "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .h { font-weight: 400; fill: #ffffff; font-size: 14px; }
    .m { fill: var(--muted); font-size: 12px; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .db { fill: var(--db); stroke: var(--accent); stroke-width: 1.6; }
    .ai { fill: var(--ai); stroke: var(--line); stroke-width: 1.2; }
    .lane { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .thin { stroke: var(--muted); stroke-width: 1.2; fill: none; marker-end: url(#b); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="1100" height="700" fill="var(--bg)"/>

  <!-- Channels -->
  <text class="h" x="30" y="34">Channels</text>
  <rect class="box" x="30" y="48" width="190" height="70" rx="10"/><text class="h" x="46" y="74">Form and e-mail</text><text class="m" x="46" y="94">POST /order, /triage</text>
  <rect class="box" x="30" y="132" width="190" height="70" rx="10"/><text class="h" x="46" y="158">Calculator (web)</text><text class="m" x="46" y="178">index.html, /quote-preview</text>
  <rect class="box" x="30" y="216" width="190" height="70" rx="10"/><text class="h" x="46" y="242">Showroom tablet</text><text class="m" x="46" y="262">showroom.html + token</text>
  <rect class="box" x="30" y="300" width="190" height="70" rx="10"/><text class="h" x="46" y="326">Status page</text><text class="m" x="46" y="346">status.html (anon role)</text>
  <rect class="box" x="30" y="384" width="190" height="70" rx="10"/><text class="h" x="46" y="410">Owner and team</text><text class="m" x="46" y="430">approval links (Basic auth)</text>

  <!-- n8n -->
  <rect class="lane" x="280" y="20" width="400" height="610" rx="14"/>
  <text class="h" x="296" y="46">n8n: orchestration (workflows generated from code)</text>
  <rect class="box" x="300" y="62" width="360" height="54" rx="8"/><text class="h" x="314" y="84">01 intake · 02 sweeper · 11 triage</text><text class="m" x="314" y="104">orders from e-mail and forms, mail routing</text>
  <rect class="box" x="300" y="128" width="360" height="54" rx="8"/><text class="h" x="314" y="150">06 calculator · 13 showroom</text><text class="m" x="314" y="170">public quote API and tablet orders</text>
  <rect class="box" x="300" y="194" width="360" height="54" rx="8"/><text class="h" x="314" y="216">03 team tasks · 08 supplier orders</text><text class="m" x="314" y="236">approval, reservations, PO drafts, deliveries</text>
  <rect class="box" x="300" y="260" width="360" height="54" rx="8"/><text class="h" x="314" y="282">04 stock and prices · 07 weekly report</text><text class="m" x="314" y="302">CSV price-list import, bestsellers</text>
  <rect class="box" x="300" y="326" width="360" height="54" rx="8"/><text class="h" x="314" y="348">09 quote follow-up · 10 status · 12 reviews</text><text class="m" x="314" y="368">reminders, lost-quote survey, status, review request</text>
  <rect class="box" x="300" y="392" width="360" height="54" rx="8"/><text class="h" x="314" y="414">05 delivery (every minute)</text><text class="m" x="314" y="434">email_outbox → Gmail SMTP, slack_outbox → Slack</text>
  <rect class="ai" x="300" y="470" width="360" height="62" rx="8"/><text class="h" x="314" y="492">00 LLM: local model (agy), no API key</text><text class="m" x="314" y="512">prompt as base64 via stdin; output always validated</text>
  <text class="m" x="300" y="560">Workflows only call SQL functions and queue notifications.</text>
  <text class="m" x="300" y="578">The database makes the decisions (routing, quote, reservations).</text>

  <!-- Supabase -->
  <rect class="db" x="740" y="20" width="330" height="440" rx="14"/>
  <text class="h" x="760" y="48">Supabase (Postgres): source of truth</text>
  <text class="m" x="760" y="74">orders · order_items · order_events</text>
  <text class="m" x="760" y="94">tasks · stock_movements · materials</text>
  <text class="m" x="760" y="114">suppliers · supplier_prices</text>
  <text class="m" x="760" y="134">purchase_orders · lost_reasons</text>
  <text class="m" x="760" y="154">inbox_messages · showrooms</text>
  <text class="m" x="760" y="174">email_outbox · slack_outbox</text>
  <text class="h" x="760" y="214">SQL functions (RPC, search_path pinned)</text>
  <text class="m" x="760" y="238">estimate_quote · quote_preview · best_price</text>
  <text class="m" x="760" y="258">create_task (FOR UPDATE) · approve_order</text>
  <text class="m" x="760" y="278">create_purchase_orders · receive_delivery</text>
  <text class="m" x="760" y="298">record_followup · mark_lost_quotes</text>
  <text class="m" x="760" y="318">triage_complete · showroom_order</text>
  <text class="m" x="760" y="338">notify_status_events · send_review_requests</text>
  <text class="m" x="760" y="358">bestsellers · weekly_report</text>
  <text class="h" x="760" y="398">Rules</text>
  <text class="m" x="760" y="420">RLS with no policies, service_role only</text>
  <text class="m" x="760" y="440">anon: only order_status_public(token)</text>

  <!-- Outputs -->
  <rect class="box" x="740" y="490" width="150" height="56" rx="10"/><text class="h" x="756" y="514">Slack</text><text class="m" x="756" y="534">#orders-demo</text>
  <rect class="box" x="920" y="490" width="150" height="56" rx="10"/><text class="h" x="936" y="514">Gmail SMTP</text><text class="m" x="936" y="534">off by default</text>

  <!-- Arrows -->
  <path class="arrow" d="M220 83 H298"/>
  <path class="arrow" d="M220 167 H298"/>
  <path class="arrow" d="M220 251 H298"/>
  <path class="arrow" d="M220 419 H298"/>
  <path class="arrow" d="M660 160 H738"/>
  <path class="arrow" d="M660 300 H738"/>
  <path class="thin" d="M220 335 H738"/>
  <path class="arrow" d="M660 420 H715 V518 H738"/>
  <path class="arrow" d="M715 420 V580 H995 V548"/>
  <path class="thin" d="M480 532 V548"/>
  <text class="m" x="30" y="490">Dashed lines:</text>
  <text class="m" x="30" y="510">status read with the anon role,</text>
  <text class="m" x="30" y="530">model called by a sub-workflow.</text>
</svg>
