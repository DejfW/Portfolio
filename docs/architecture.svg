<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d">
  <title id="t">Architektura systemu automatyzacji stolarni</title>
  <desc id="d">Kanały wejścia (formularz, kalkulator, tablet w salonie, poczta) trafiają do workflowów n8n, które wołają funkcje SQL w Supabase. Baza jest jedynym źródłem prawdy, a powiadomienia przechodzą przez kolejki outbox do Slacka i Gmaila. Model AI działa lokalnie przez agy.</desc>
  <style>
    :root { --bg:#faf7f2; --box:#ffffff; --ink:#2b2118; --muted:#6f6256; --line:#cdbfae; --accent:#8a5a2b; --db:#e9f1e7; --ai:#f4e7d3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1b1612; --box:#251e18; --ink:#f1e9df; --muted:#b5a798; --line:#4a3d31; --accent:#d49a5a; --db:#1f2c22; --ai:#33271a; }
    }
    text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .h { font-weight: 700; font-size: 14px; }
    .m { fill: var(--muted); font-size: 12px; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .db { fill: var(--db); stroke: var(--accent); stroke-width: 1.6; }
    .ai { fill: var(--ai); stroke: var(--line); stroke-width: 1.2; }
    .lane { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 4; }
    .arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .thin { stroke: var(--muted); stroke-width: 1.2; fill: none; marker-end: url(#b); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="1100" height="700" fill="var(--bg)"/>

  <!-- Kanały -->
  <text class="h" x="30" y="34">Kanały</text>
  <rect class="box" x="30" y="48" width="190" height="70" rx="10"/><text class="h" x="46" y="74">Formularz i poczta</text><text class="m" x="46" y="94">POST /order, /triage</text>
  <rect class="box" x="30" y="132" width="190" height="70" rx="10"/><text class="h" x="46" y="158">Kalkulator (web)</text><text class="m" x="46" y="178">index.html, /quote-preview</text>
  <rect class="box" x="30" y="216" width="190" height="70" rx="10"/><text class="h" x="46" y="242">Tablet w salonie</text><text class="m" x="46" y="262">showroom.html + token</text>
  <rect class="box" x="30" y="300" width="190" height="70" rx="10"/><text class="h" x="46" y="326">Strona statusu</text><text class="m" x="46" y="346">status.html (rola anon)</text>
  <rect class="box" x="30" y="384" width="190" height="70" rx="10"/><text class="h" x="46" y="410">Właściciel i zespół</text><text class="m" x="46" y="430">linki zatwierdzeń (Basic)</text>

  <!-- n8n -->
  <rect class="lane" x="280" y="20" width="400" height="610" rx="14"/>
  <text class="h" x="296" y="46">n8n: orkiestracja (workflowy generowane z kodu)</text>
  <rect class="box" x="300" y="62" width="360" height="54" rx="8"/><text class="h" x="314" y="84">01 intake · 02 sweeper · 11 triage</text><text class="m" x="314" y="104">zamówienia z maili i formularzy, kierowanie poczty</text>
  <rect class="box" x="300" y="128" width="360" height="54" rx="8"/><text class="h" x="314" y="150">06 kalkulator · 13 salon</text><text class="m" x="314" y="170">publiczne API wyceny i zamówień z tabletu</text>
  <rect class="box" x="300" y="194" width="360" height="54" rx="8"/><text class="h" x="314" y="216">03 zadania zespołu · 08 zamówienia do hurtowni</text><text class="m" x="314" y="236">zatwierdzanie, rezerwacje, szkice PO, dostawy</text>
  <rect class="box" x="300" y="260" width="360" height="54" rx="8"/><text class="h" x="314" y="282">04 magazyn i ceny · 07 raport tygodniowy</text><text class="m" x="314" y="302">import cenników CSV, bestsellery</text>
  <rect class="box" x="300" y="326" width="360" height="54" rx="8"/><text class="h" x="314" y="348">09 follow-up wycen · 10 statusy · 12 opinie</text><text class="m" x="314" y="368">przypomnienia, ankieta rezygnacji, status, prośba o opinię</text>
  <rect class="box" x="300" y="392" width="360" height="54" rx="8"/><text class="h" x="314" y="414">05 dostarczanie (co minutę)</text><text class="m" x="314" y="434">email_outbox → Gmail SMTP, slack_outbox → Slack</text>
  <rect class="ai" x="300" y="470" width="360" height="62" rx="8"/><text class="h" x="314" y="492">00 LLM: lokalny model (agy), bez klucza API</text><text class="m" x="314" y="512">prompt w base64 przez stdin; wynik zawsze walidowany</text>
  <text class="m" x="300" y="560">Workflow tylko woła funkcje SQL i kolejkuje powiadomienia.</text>
  <text class="m" x="300" y="578">Decyzje (trasa poczty, wycena, rezerwacje) podejmuje baza.</text>

  <!-- Supabase -->
  <rect class="db" x="740" y="20" width="330" height="440" rx="14"/>
  <text class="h" x="760" y="48">Supabase (Postgres): źródło prawdy</text>
  <text class="m" x="760" y="74">orders · order_items · order_events</text>
  <text class="m" x="760" y="94">tasks · stock_movements · materials</text>
  <text class="m" x="760" y="114">suppliers · supplier_prices</text>
  <text class="m" x="760" y="134">purchase_orders · lost_reasons</text>
  <text class="m" x="760" y="154">inbox_messages · showrooms</text>
  <text class="m" x="760" y="174">email_outbox · slack_outbox</text>
  <text class="h" x="760" y="214">Funkcje SQL (RPC, search_path ustawiony)</text>
  <text class="m" x="760" y="238">estimate_quote · quote_preview · best_price</text>
  <text class="m" x="760" y="258">create_task (FOR UPDATE) · approve_order</text>
  <text class="m" x="760" y="278">create_purchase_orders · receive_delivery</text>
  <text class="m" x="760" y="298">record_followup · mark_lost_quotes</text>
  <text class="m" x="760" y="318">triage_complete · showroom_order</text>
  <text class="m" x="760" y="338">notify_status_events · send_review_requests</text>
  <text class="m" x="760" y="358">bestsellers · weekly_report</text>
  <text class="h" x="760" y="398">Zasady</text>
  <text class="m" x="760" y="420">RLS bez polityk, dostęp tylko service_role</text>
  <text class="m" x="760" y="440">anon: wyłącznie order_status_public(token)</text>

  <!-- Wyjścia -->
  <rect class="box" x="740" y="490" width="150" height="56" rx="10"/><text class="h" x="756" y="514">Slack</text><text class="m" x="756" y="534">#zamowienia-demo</text>
  <rect class="box" x="920" y="490" width="150" height="56" rx="10"/><text class="h" x="936" y="514">Gmail SMTP</text><text class="m" x="936" y="534">domyślnie wyłączony</text>

  <!-- Strzałki -->
  <path class="arrow" d="M220 83 H298"/>
  <path class="arrow" d="M220 167 H298"/>
  <path class="arrow" d="M220 251 H298"/>
  <path class="arrow" d="M220 419 H298"/>
  <path class="arrow" d="M660 160 H738"/>
  <path class="arrow" d="M660 300 H738"/>
  <path class="thin" d="M220 335 H738"/>
  <path class="arrow" d="M660 420 H715 V518 H738"/>
  <path class="arrow" d="M715 420 V580 H995 V548"/>
  <path class="thin" d="M480 532 V548"/>
  <text class="m" x="30" y="490">Linie przerywane:</text>
  <text class="m" x="30" y="510">status czytany rolą anon,</text>
  <text class="m" x="30" y="530">model wołany sub-workflowem.</text>
</svg>
